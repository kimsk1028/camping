name: Build Camping App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter Project & Inject Code
        run: |
          # 1. 표준 Flutter 프로젝트 생성
          flutter create temp_app --org=com.romantic.camping
          
          # 2. 작성한 메인 코드 복사
          cp lib/main.dart temp_app/lib/main.dart
          
          # 3. AndroidManifest.xml의 android:label 속성을 정규식으로 안전하게 '낭만캠핑'으로 정교 치환
          python3 -c "
          import re
          path = 'temp_app/android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # android:label=\"...\" 패턴 전체를 '낭만캠핑'으로 교체
          new_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"낭만캠핑\"', content)
          
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_content)
          "
          
          # 4. APK 빌드
          cd temp_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # 5. 아티팩트 복사
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          cp temp_app/build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: romantic-camping-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
