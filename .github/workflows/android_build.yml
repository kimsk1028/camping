name: Build Camping App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter Project & Inject Code
        run: |
          # 1. Flutter 프로젝트 생성
          flutter create temp_app --name romantic_camping --org com.example.romantic_camping
          
          # 2. main.dart 복사
          cp lib/main.dart temp_app/lib/main.dart
          
          # 3. AndroidManifest.xml 명확한 클래스명 및 '낭만캠핑' 라벨 지정
          cat << 'EOF' > temp_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.romantic_camping">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <application
                  android:label="낭만캠핑"
                  android:name="io.flutter.app.FlutterApplication"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name="com.example.romantic_camping.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 4. APK 빌드
          cd temp_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # 5. 결과물 위치 이동
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          cp temp_app/build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: romantic-camping-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
