name: Build Camping App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter Project & Inject Code
        run: |
          # 1. 새 Flutter 프로젝트 생성
          flutter create temp_app --org=com.example.camping
          
          # 2. main.dart 복사
          cp lib/main.dart temp_app/lib/main.dart
          
          # 3. APK 빌드
          cd temp_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # 4. 결과물 위치 이동
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          cp temp_app/build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camping-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
